name: CI - Multi-OS Cross-Platform Build & Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Build & Test (${{ matrix.os }} - Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [20.x, 22.x, 24.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: |
            Backend/package-lock.json
            Frontend/package-lock.json

      # ─── Backend Validation ───
      - name: Install Backend Dependencies
        working-directory: ./Backend
        run: npm install

      - name: Validate Backend Syntax & Entry Point
        working-directory: ./Backend
        run: node -c app.js

      # ─── Frontend Validation ───
      - name: Install Frontend Dependencies
        working-directory: ./Frontend
        run: npm install --include=optional

      - name: Run Frontend Linter (Oxlint)
        working-directory: ./Frontend
        run: npm run lint || true

      - name: Build Frontend Production Bundle
        working-directory: ./Frontend
        run: npm run build
        env:
          VITE_API_URL: http://localhost:5001/api

      # ─── Upload Production Artifact (Ubuntu Node 22 only) ───
      - name: Upload Frontend Build Artifact
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22.x'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: Frontend/dist/
          retention-days: 7
